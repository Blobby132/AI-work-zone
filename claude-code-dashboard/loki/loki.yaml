# Single-binary Loki on local disk. Holds the per-prompt event stream
# (api_error, tool_result, tool_decision, user_prompt) that OTLP logs carry.
auth_enabled: false

server:
  http_listen_port: 3100
  grpc_listen_port: 9096
  log_level: warn

common:
  instance_addr: 127.0.0.1
  path_prefix: /loki
  storage:
    filesystem:
      chunks_directory: /loki/chunks
      rules_directory: /loki/rules
  replication_factor: 1
  ring:
    kvstore:
      store: inmemory

schema_config:
  configs:
    - from: 2024-04-01
      store: tsdb
      object_store: filesystem
      schema: v13
      index:
        prefix: index_
        period: 24h

limits_config:
  # Required for OTLP ingestion — Claude Code's event attributes arrive as
  # structured metadata, and Loki rejects the payload as malformed without
  # this. Default-on in Loki 3.x; stated explicitly so an older image or a
  # config merge cannot silently break log ingest.
  allow_structured_metadata: true
  volume_enabled: true
  retention_period: 744h
  reject_old_samples: false

compactor:
  working_directory: /loki/compactor
  retention_enabled: true
  delete_request_store: filesystem

analytics:
  reporting_enabled: false
