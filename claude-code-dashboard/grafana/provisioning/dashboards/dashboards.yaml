apiVersion: 1

providers:
  - name: claude-code
    orgId: 1
    folder: Claude Code
    type: file
    disableDeletion: false
    # Edits in the Grafana UI stick until the file changes on disk. Export
    # the JSON back to grafana/dashboards/ to keep them.
    allowUiUpdates: true
    updateIntervalSeconds: 30
    options:
      path: /var/lib/grafana/dashboards
      foldersFromFilesStructure: false
