# Local observability stack for Claude Code telemetry.
#
# Every port is bound to 127.0.0.1 on purpose. Grafana below runs with
# anonymous admin access so the dashboard opens without a login, which is
# only safe because nothing here is reachable from off this machine. If you
# move this to a shared host, drop the GF_AUTH_ANONYMOUS_* variables and
# remove the 127.0.0.1 prefixes deliberately, not by accident.

name: claude-code-dashboard

services:
  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.161.0
    container_name: cc-otel-collector
    restart: unless-stopped
    command: ["--config=/etc/otel/collector.yaml"]
    volumes:
      - ./otel/collector.yaml:/etc/otel/collector.yaml:ro
    ports:
      - "127.0.0.1:4317:4317"   # OTLP gRPC   <- Claude Code pushes here
      - "127.0.0.1:4318:4318"   # OTLP HTTP
    expose:
      - "8889"                  # Prometheus scrape surface, stack-internal
    depends_on:
      - loki

  prometheus:
    image: prom/prometheus:v3.14.0
    container_name: cc-prometheus
    restart: unless-stopped
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=365d
      - --web.enable-lifecycle
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    ports:
      - "127.0.0.1:9090:9090"

  loki:
    image: grafana/loki:3.7.8
    container_name: cc-loki
    restart: unless-stopped
    command: ["-config.file=/etc/loki/loki.yaml"]
    volumes:
      - ./loki/loki.yaml:/etc/loki/loki.yaml:ro
      - loki-data:/loki
    ports:
      - "127.0.0.1:3100:3100"

  grafana:
    image: grafana/grafana:13.2.2
    container_name: cc-grafana
    restart: unless-stopped
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Admin
      GF_AUTH_DISABLE_LOGIN_FORM: "true"
      GF_USERS_DEFAULT_THEME: dark
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /var/lib/grafana/dashboards/claude-code.json
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana-data:/var/lib/grafana
    ports:
      - "127.0.0.1:3000:3000"
    depends_on:
      - prometheus
      - loki

volumes:
  prometheus-data:
  loki-data:
  grafana-data:
